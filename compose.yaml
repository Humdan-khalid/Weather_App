services:
  api:
    build: .
    env_file:
      - .env 
    ports: 
      - "8000:8000"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_Password}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes: 
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:latest

volumes:
  postgres_data:

